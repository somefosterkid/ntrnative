"src/ov018/intrude_field.c" = ["-ipa function"]
"src/ov020/field_wfbc_data_local.c" = ["-ipa function"]
"src/ov021/field_actor_animation.c" = ["-ipa function"]
"src/ov018/ov018_02180980.c" = ["-ipa function"]
"src/ov174/ov174_021b6100.c" = ["-ipa function"]
"src/ov010/delivery_beacon.c" = ["-ipa function", '-pragma "explicit_zero_data on"']
"src/ov195/shinka_demo_view.c" = ["-ipa function"]
"src/ov172/ctvt_draw.c" = ["-ipa function"]
"src/ov011/intrude_comm.c" = ["-ipa function"]
