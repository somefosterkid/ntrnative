# On top of linux.ini when ccache is installed (tools/port_run.py, tools/route.py: `meson setup ... --native-file
# port/machine/linux.ini --native-file port/machine/linux-ccache.ini`). A compiler named in a native file is not wrapped
# by meson's own ccache detection, so name it here. ccache's base_dir (set to the main checkout) makes the paths relative:
# every worktree's build shares the cache.
[binaries]
c = ['ccache', 'clang']
cpp = ['ccache', 'g++']
