# On top of linux.ini when ccache is installed (tools/port_run.py, tools/route.py: `meson setup ... --native-file
# port/machine/linux.ini --native-file port/machine/linux-ccache.ini`). A compiler named in a native file is not wrapped
# by meson's own ccache detection, so name it here. ccache's base_dir (set to the main checkout) makes the paths relative:
# every worktree's build shares the cache.
#
# libntr's precompiled header (nitro_pch.h.pch) needs two things for ccache to cache the objects that use it (without them
# every one is "could not use precompiled header": ~136k of them in the shared cache's first months):
#   - /etc/ccache.conf: sloppiness = pch_defines,time_macros (ccache refuses direct mode with a PCH otherwise)
#   - -Xclang -fno-pch-timestamp below: the .pch no longer embeds its creation time, so the cached one is byte-identical
# (clang's PCH also embeds the worktree's absolute path; ccache restores the first worktree's .pch from its cache, so
# the objects of every worktree hash the same PCH.) That path must not be needed again: with the first worktree deleted
# a later compile fails "malformed or corrupted AST file: could not find file <deleted>/.../nitro_pch.h" (measured 11-20,
# -ffile-prefix-map does not help), so -Xclang -fno-validate-pch: the PCH is used without re-reading its input files
# (ninja's depfiles still rebuild the .pch and its users when a header changes).
# The .pch itself never goes through the cache (ccache-nopch: a cached .pch names its writer's build dir and generated headers,
# and fails "could not find file" in every other dir once the writer's is deleted: 11-21), so each build dir makes its own.
[built-in options]
c_args = ['-Xclang', '-fno-pch-timestamp', '-Xclang', '-fno-validate-pch']

[binaries]
c = ['@GLOBAL_SOURCE_ROOT@/machine/ccache-nopch', 'clang']
cpp = ['@GLOBAL_SOURCE_ROOT@/machine/ccache-nopch', 'g++']
