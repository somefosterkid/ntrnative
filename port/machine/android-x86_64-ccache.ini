# On top of android-x86_64.ini when ccache is installed (tools/android_package.sh --build; a NEW build dir only): the NDK's compilers
# behind ccache, so the objects are cached like the Linux ones (linux-ccache.ini) and every checkout of the machine shares them.
# -Xclang -fno-pch-timestamp: see android-arm64-ccache.ini.
[constants]
bin = '/opt/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = ['ccache', bin / 'x86_64-linux-android24-clang']
cpp = ['ccache', bin / 'x86_64-linux-android24-clang++']

[built-in options]
c_args = args + ['-Xclang', '-fno-pch-timestamp', '-Xclang', '-fno-validate-pch']   # (the last: see linux-ccache.ini)
