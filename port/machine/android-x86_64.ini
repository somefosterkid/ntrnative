# The PC build for the Android emulator, x86_64 (the maintainers' notes, "Android"): android-arm64.ini for the other ABI. This host has
# /dev/kvm in WSL, so x86_64 system images run accelerated; arm64 code does not run in them. A NATIVE file like ios.ini:
#   meson setup build/port/android-x86_64 port --native-file port/machine/android-x86_64.ini
[constants]
bin = '/opt/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin'
deps = '/opt/android/deps/x86_64'
args = ['-fPIC', '-I' + deps / 'include']
link = ['-L' + deps / 'lib', '-static-libstdc++', '-Wl,--no-undefined', '-lGLESv3', '-lEGL', '-llog', '-landroid']

[binaries]
c = bin / 'x86_64-linux-android24-clang'
cpp = bin / 'x86_64-linux-android24-clang++'
ar = bin / 'llvm-ar'
strip = bin / 'llvm-strip'

[properties]
skip_sanity_check = true

[built-in options]
c_args = args
cpp_args = args
c_link_args = link
cpp_link_args = link
