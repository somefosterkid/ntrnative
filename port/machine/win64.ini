# The PC build for win64, cross from WSL (docs/port-build.md, docs/libntr/build.md "win64"). libntr's PC targets are
# all native: true, so mingw-w64 goes in as the build machine's compiler through this native file, not a cross file.
# clang --target=x86_64-w64-mingw32 for C (the game's C needs -fms-extensions), mingw g++ (posix threads: libntr
# uses pthreads) for libntr's C++ and the link. mingw = SDL2 and enet for mingw (Ubuntu has none; build.md says
# how to get them), plus a shim dir with Windows.h (mingw's header is windows.h).
[constants]
mingw = '/root/pc/t40u/mingw'

[binaries]
c = ['clang', '--target=x86_64-w64-mingw32']
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-gcc-ar-posix'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'false'

[built-in options]
c_args = ['-I' + mingw + '/include', '-I' + mingw + '/shim', '-U_FORTIFY_SOURCE']
cpp_args = ['-I' + mingw + '/include', '-I' + mingw + '/shim', '-U_FORTIFY_SOURCE']
c_link_args = ['-L' + mingw + '/lib', '-static-libgcc', '-static-libstdc++']
cpp_link_args = ['-L' + mingw + '/lib', '-static-libgcc', '-static-libstdc++']

[properties]
# WSL can't run the PE test program under systemd-run
skip_sanity_check = true
