# The PC build for win64 built ON Windows (tools/port_win64.py; docs/port-build.md "win64 on Windows"): win64.ini's
# compilers from a WinLibs MinGW-w64 folder (GCC 13 posix + LLVM 18 + MinGW-w64 11, MSVCRT: the versions Ubuntu 24.04's
# clang and mingw-w64 cross packages have), whose bin\ tools/port_win64.py puts first in PATH. tools/port_win64.py writes
# the constants file given before this one (mingw = SDL2 and enet for mingw). No shim dir: Windows' file names ignore case.
[binaries]
c = ['clang', '--target=x86_64-w64-mingw32']
cpp = 'g++'
ar = 'gcc-ar'
strip = 'strip'
windres = 'windres'
pkg-config = 'false'

[built-in options]
c_args = ['-I' + mingw + '/include', '-U_FORTIFY_SOURCE']
cpp_args = ['-I' + mingw + '/include', '-U_FORTIFY_SOURCE']
c_link_args = ['-L' + mingw + '/lib', '-static-libgcc', '-static-libstdc++']
cpp_link_args = ['-L' + mingw + '/lib', '-static-libgcc', '-static-libstdc++']
