# TEST ONLY: linux.ini with plain char unsigned in everything that is not the game, as Android arm64 has it (the game keeps its
# -fsigned-char from port/meson.build). Use: BWPORT_BUILD=build/port/linux-uc BWPORT_NATIVE=port/machine/linux-unsigned.ini
# python3 tools/port_run.py ... (the maintainers' notes, Android section: the boy/girl lead).
[binaries]
c = 'clang'
cpp = 'g++'

[built-in options]
c_args = ['-funsigned-char']
cpp_args = ['-funsigned-char']
