# The PC build for Android phones, arm64-v8a, the ABI that ships (the maintainers' notes, "Android"). The NDK's clang and SDL2 + enet
# built with it, from tools/android_deps.sh (/opt/android). A NATIVE file like ios.ini (the project builds everything native: true):
#   meson setup build/port/android-arm64 port --native-file port/machine/android-arm64.ini
# port/meson.build (is_android) links the game as a shared object, SDL's main library: tools/android_package.sh puts it in the APK
# as lib/arm64-v8a/libmain.so. -fPIC everywhere: libntr asks for its static libraries without PIC, and a shared object needs it.
[constants]
bin = '/opt/android/sdk/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin'
deps = '/opt/android/deps/arm64-v8a'
args = ['-fPIC', '-I' + deps / 'include']
link = ['-L' + deps / 'lib', '-static-libstdc++', '-Wl,--no-undefined', '-lGLESv3', '-lEGL', '-llog', '-landroid']

[binaries]
c = bin / 'aarch64-linux-android24-clang'
cpp = bin / 'aarch64-linux-android24-clang++'
ar = bin / 'llvm-ar'
strip = bin / 'llvm-strip'

[properties]
skip_sanity_check = true

[built-in options]
c_args = args
cpp_args = args
c_link_args = link
cpp_link_args = link
