# On top of win64.ini when ccache is installed (tools/port_win64.sh; a NEW build dir only): the same compilers behind ccache, so the
# win64 objects are cached like the Linux ones (linux-ccache.ini) and every checkout on the machine shares them (ccache.conf's base_dir).
[binaries]
c = ['ccache', 'clang', '--target=x86_64-w64-mingw32']
cpp = ['ccache', 'x86_64-w64-mingw32-g++-posix']
