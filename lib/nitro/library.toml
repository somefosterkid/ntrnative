# Files built with other flags, each replacing the library's flag of the same option. The SDK's CARD library was built
# with -ipa file, as pokebw2's lib/nitro/library.toml builds card_pull_out.c: card_rom.c and card_pullOut.c reach each
# of their statics from one base (cardi_rom_base, 0x02150840 in Black, and the three words at 0x02150b00), where the
# game's flags load a literal for each
[file_flags]
"card/card_rom.c" = ["-ipa file"]
"card/card_pullOut.c" = ["-ipa file"]
# The cartridge library's files in the game's flags, as pokebw2 builds them (Thumb, with the game's functions in ARM by pragma)
"ctrdg/ctrdg.c" = ["-thumb", "-ipa file", "-inline on,noauto"]
"ctrdg/ctrdg_proc.c" = ["-thumb", "-ipa file", "-inline on,noauto"]
# TwlSDK 5's os_emulator.c, built as the SDK was: its statics are reached from their section's base
"os/os_emulator.c" = ["-ipa file", "-inline on,noauto"]
